<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Asteroids</title>
  <script src="assets/vector-battle-regular.typeface.js"></script>
  <script src="game.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container show-panels">
    <canvas id="canvas"></canvas>

    <div class="info-panel left-panel">
      <h2>Asteroids</h2>
      <p>消灭所有小行星，避免碰撞，获得高分。击碎行星会产生大量小行星。</p>
      <p><strong>注意：</strong>调整窗口大小后请刷新。</p>
    </div>

    <div class="info-panel right-panel">
      <h2>键位说明</h2>
      <p>
        ← → / A D：转向<br>
        ↑ / W：加速<br>
        ↓ / S：减速<br>
        <br>
        Space：机炮 + 导弹<br>
        Q / Z：导弹<br>
        <br>
        Esc / P：暂停（唤出菜单）<br>
        M：静音【<span id="status-mute">--</span>】<br>
        F：显示刷新率【<span id="status-framerate">--</span>】<br>
        G：显示碰撞箱【<span id="status-grid">--</span>】<br>        
        U：玩家状态UI【<span id="status-playerui">--</span>】<br>
      </p>
    </div>
  </div>
</body>

</html>
